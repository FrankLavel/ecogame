<!doctype html><html lang="es"><meta charset="utf-8"><title>EcoGame · Pruebas de aceptación</title>
<style>body{background:#f7f4e7;color:#244c42;font:16px Arial;max-width:1000px;margin:40px auto;padding:20px}h1{font-size:32px}li{padding:8px;border-bottom:1px solid #d9dfbc}.pass{color:#277b58}.fail{color:#b34438}iframe{width:640px;height:360px;border:0;border-radius:16px}button{padding:12px 20px;background:#277b58;color:#fff9e9;border:0;border-radius:8px;font-size:16px}pre{white-space:pre-wrap}</style>
<h1>EcoGame · Pruebas de aceptación</h1><p>Estas pruebas cargan el juego exportado por Construct y ejecutan sus eventos reales. Las posiciones y variables se preparan únicamente dentro de esta página de pruebas.</p>
<button id="run">Ejecutar pruebas</button><p id="status">Listo para comenzar.</p><ol id="results"></ol><iframe id="game" title="Juego bajo prueba"></iframe><pre id="report"></pre>
<script>
const frame=document.querySelector('#game'),results=[],list=document.querySelector('#results');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let rt,vars;
function assert(ok,msg){if(!ok)throw Error(msg)}
const val=n=>vars[n].getValue(),set=(n,v)=>vars[n].setValue(v);
async function evidence(name){if(rt.glwrap)rt.drawGL();else rt.draw();const blob=await new Promise(resolve=>frame.contentDocument.querySelector('canvas').toBlob(resolve,'image/png'));await fetch('/__qa/'+name+'.png',{method:'POST',body:blob})}
async function until(fn){for(let i=0;i<100;i++){if(fn())return;await sleep(50)}throw Error('Tiempo de espera agotado')}
async function load(){await new Promise(resolve=>{frame.onload=resolve;frame.src='../export/html5/index.html?qa='+Date.now()});rt=null;await until(()=>{try{rt=frame.contentWindow.cr_getC2Runtime?.();return rt?.running_layout&&rt.all_global_vars.length>0}catch{return false}});vars=Object.fromEntries(rt.all_global_vars.map(v=>[v.name,v]));await sleep(120)}
async function command(cmd){set('Cmd',cmd);await sleep(120)}
// Construct strips object names in release exports; the source order is stable.
const typeIndex={Park:0,Hud:1,Overlay:2,Player:3,Trash:4,Bin:5,Hit:6,Obstacle:7,Progress:8,Halo:21,Boss:22,Warning:23,Bolt:24,BossPanel:25,BossBar:26,BossText:27,Water:28,Leaves:29,Spark:30,HeldIcon:31,GuideMarker:32,ActionText:33,PauseMusic:34,PauseGuide:35,EnemyShot:36,ChargeTrail:37};
function type(name){return rt.types_by_index[typeIndex[name]]}
function move(x,y){const p=type('Player').instances[0];p.x=x;p.y=y;p.behavior_insts[0].dx=0;p.behavior_insts[0].dy=0;p.set_bbox_changed()}
async function pickup(item){move(item.x,item.y-15);await sleep(120)}
async function deliver(kind){const bin=type('Bin').instances.find(b=>b.instance_vars[0]===kind);move(bin.x,bin.y+65);await command(5)}
async function test(name,fn){try{await fn();results.push({name,status:'PASS'});list.insertAdjacentHTML('beforeend','<li class="pass">✓ '+name+'</li>')}catch(e){results.push({name,status:'FAIL',error:e.message});list.insertAdjacentHTML('beforeend','<li class="fail">✕ '+name+': '+e.message+'</li>')}}
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;list.textContent='';results.length=0;document.querySelector('#status').textContent='Ejecutando el motor de Construct…';
 try{
 await test('Inicio: 12 residuos, 3 vidas, 180 segundos y puntaje cero',async()=>{await load();assert(val('State')===0&&val('Lives')===3&&val('TimeLeft')===180&&val('Score')===0,'Estado inicial incorrecto');assert(type('Trash').instances.length===12,'Deben existir 12 residuos')});
 await test('Comenzar cambia al estado de juego',async()=>{await command(4);assert(val('State')===1,'No comenzó');await evidence('juego')});
 await test('Sprites con 16 cuadros de caminata, 6 poses del jefe y 8 cuadros de agua',async()=>{assert(type('Player').instances[0].cur_animation.frames.length===16,'Faltan direcciones del personaje');assert(type('Boss').instances[0].cur_animation.frames.length===6,'Faltan poses del pato');assert(type('Water').instances[0].cur_animation.frames.length===8,'Faltan cuadros del agua')});
 await test('El teclado selecciona animación de caminar y reposo en las cuatro direcciones',async()=>{for(const [key,code,facing] of [['ArrowLeft',37,4],['ArrowRight',39,8],['ArrowUp',38,12],['ArrowDown',40,0]]){const w=frame.contentWindow;frame.contentDocument.dispatchEvent(new w.KeyboardEvent('keydown',{key,code:key,keyCode:code,which:code,bubbles:true}));await sleep(180);const index=type('Player').instances[0].cur_frame;assert(val('Facing')===facing&&index>=facing&&index<facing+4,'Dirección o animación incorrecta: '+key);frame.contentDocument.dispatchEvent(new w.KeyboardEvent('keyup',{key,code:key,keyCode:code,which:code,bubbles:true}));await sleep(180);assert(type('Player').instances[0].cur_frame===facing,'Reposo incorrecto: '+key)}});
 await test('Colisión recoge un residuo y conserva categoría y nombre',async()=>{const item=type('Trash').instances.find(t=>t.instance_vars[0]===2);const label=item.instance_vars[1];await pickup(item);assert(val('Carry')===2&&val('ItemName')===label&&typeof label==='string','Mochila incorrecta');assert(type('Trash').instances.length===11,'El residuo no desapareció')});
 await test('La mochila muestra el icono recogido y la flecha señala ENVASES',async()=>{const icon=type('HeldIcon').instances[0],guide=type('GuideMarker').instances[0];assert(icon.visible&&icon.opacity>0.9&&icon.cur_frame===2,'Icono incorrecto o invisible');assert(guide.visible&&guide.opacity>0.5&&guide.x===640&&guide.cur_frame===1,'La flecha no señala el contenedor amarillo')});
 await test('La mochila admite un único residuo',async()=>{await pickup(type('Trash').instances[0]);assert(type('Trash').instances.length===11&&val('Carry')===2,'Recogió un segundo residuo')});
 await test('Entregar lejos de los contenedores no resta vidas ni suma puntos',async()=>{move(640,480);await command(5);assert(val('Lives')===3&&val('Score')===0&&val('Carry')===2,'Entrega a distancia aceptada')});
 await test('Contenedor incorrecto resta una vida, conserva residuo e indica ENVASES',async()=>{await deliver(1);assert(val('Lives')===2&&val('Carry')===2&&val('Score')===0&&val('Tip').includes('ENVASES'),'Penalización incorrecta')});
 await test('Contenedor correcto suma 100 puntos y carga una unidad de defensa',async()=>{await deliver(2);assert(val('Score')===100&&val('Clean')===1&&val('Carry')===0,'Entrega correcta no registrada');assert(type('Bin').instances.find(b=>b.instance_vars[0]===2).instance_vars[1]===1,'No cargó el contenedor')});
 await test('Tras entregar, se ocultan el icono de mochila y la flecha',async()=>{assert(type('HeldIcon').instances[0].opacity===0&&type('GuideMarker').instances[0].opacity===0,'Las ayudas no se restablecieron')});
 await test('El agua y las hojas se animan durante la partida',async()=>{const water=type('Water').instances[0].cur_frame,y=type('Leaves').instances[0].y;await sleep(250);assert(type('Water').instances[0].cur_frame!==water&&type('Leaves').instances[0].y!==y,'El ambiente no se anima')});
 await test('Pausa congela el reloj, el personaje y las animaciones ambientales',async()=>{await command(2);const t=val('TimeLeft'),clock=val('AnimClock'),water=type('Water').instances[0].cur_frame,y=type('Leaves').instances[0].y;await sleep(200);assert(val('State')===2&&val('TimeLeft')===t&&!type('Player').instances[0].behavior_insts[0].enabled,'La pausa no congela la partida');assert(val('AnimClock')===clock&&type('Water').instances[0].cur_frame===water&&type('Leaves').instances[0].y===y,'Las animaciones siguen durante la pausa')});
 await test('La guía conserva la pausa y permite continuar',async()=>{await command(3);assert(val('State')===3,'Guía no abierta');const t=val('TimeLeft');await sleep(160);assert(val('TimeLeft')===t,'El reloj avanza en la guía');await command(4);assert(val('State')===2,'No regresó a pausa');await command(2);assert(val('State')===1,'No reanudó')});
 await test('Silenciar y reactivar actualiza el estado',async()=>{await command(6);assert(val('Muted')===1,'No silenció');await command(6);assert(val('Muted')===0,'No reactivó')});
 await test('Tres errores activan derrota y bloquean nuevas penalizaciones',async()=>{await load();await command(4);await pickup(type('Trash').instances.find(t=>t.instance_vars[0]===2));await deliver(1);await deliver(1);await deliver(1);assert(val('State')===5&&val('Lives')===0,'No terminó por vidas');await deliver(1);assert(val('Lives')===0,'Vidas negativas después de terminar')});
 await test('Reintentar restaura residuos, reloj, vidas, mochila y puntaje',async()=>{await command(4);assert(val('State')===0&&val('Lives')===3&&val('Score')===0&&val('Clean')===0&&val('Carry')===0&&val('TimeLeft')===180&&type('Trash').instances.length===12,'Reinicio incompleto')});
 await test('Dos residuos superpuestos recogen solo uno y dejan el otro en el parque',async()=>{await command(4);const [one,two]=type('Trash').instances;one.x=two.x=640;one.y=two.y=440;one.set_bbox_changed();two.set_bbox_changed();await pickup(one);assert(type('Trash').instances.length===11&&val('Carry')>0,'Recogió dos residuos a la vez');await load();await command(4)});
 await test('Agotar el tiempo activa derrota',async()=>{await command(4);set('TimeLeft',0.01);await sleep(180);assert(val('State')===5&&val('TimeLeft')===0,'No terminó por tiempo')});
 await test('12 recogidas y entregas desbloquean al jefe sin conceder victoria prematura',async()=>{await load();await command(4);for(let i=0;i<12;i++){const item=type('Trash').instances[0];const kind=item.instance_vars[0];await pickup(item);assert(val('Carry')===kind,'No recogió el residuo '+i);await deliver(kind);assert(val('Clean')===i+1,'No entregó el residuo '+i)}assert(val('State')===6&&val('Stage')===1&&val('BossHP')===6&&val('Lives')===3&&val('TimeLeft')===90,'Transición al jefe incorrecta');assert(type('Trash').instances.length===0&&type('Bin').instances.every(b=>b.instance_vars[1]===4),'No conservó las doce cargas');await evidence('intro')});
 await test('Confirmar la introducción inicia el combate sin reiniciar el reciclaje',async()=>{await command(4);assert(val('State')===1&&val('Stage')===1&&val('Clean')===12&&val('BossHP')===6,'Reinició o no comenzó el combate')});
 await test('La zona roja es visible durante el aviso y se oculta en la abertura',async()=>{set('BossClock',0.1);await sleep(100);const w=type('Warning').instances[0];assert(w.visible&&w.opacity>0.9,'El aviso no es visible');set('BossClock',2);await sleep(100);assert(w.opacity===0,'El aviso no se ocultó')});
 await test('Disparar cuando el jefe está protegido no gasta cargas',async()=>{set('BossClock',0.1);set('Cooldown',0);await deliver(1);assert(val('BossHP')===6&&type('Bin').instances[0].instance_vars[1]===4&&type('Bolt').instances[0].instance_vars[0]===0,'Gastó cargas fuera de la abertura')});
 await test('Un contenedor de color incorrecto tampoco gasta cargas',async()=>{set('BossClock',2);set('Cooldown',0);await deliver(2);assert(val('BossHP')===6&&type('Bin').instances[1].instance_vars[1]===4,'Aceptó un color incorrecto')});
 await test('Un disparo válido crea un proyectil y consume una sola carga',async()=>{set('BossClock',2);set('Cooldown',0);await deliver(1);assert(type('Bin').instances[0].instance_vars[1]===3&&type('Bolt').instances[0].instance_vars[0]===1,'No lanzó correctamente');await until(()=>val('BossHP')===5);assert(val('Shield')===2&&type('Bolt').instances[0].instance_vars[0]===0,'No hizo daño o no cambió escudo')});
 await test('Pausa detiene un proyectil en vuelo, los ataques y el tiempo',async()=>{set('BossClock',2);set('Cooldown',0);await deliver(2);await command(2);assert(val('State')===2,'No pausó');const bolt=type('Bolt').instances[0],x=bolt.x,y=bolt.y,t=val('TimeLeft'),clock=val('BossClock');await sleep(220);assert(bolt.x===x&&bolt.y===y&&val('TimeLeft')===t&&val('BossClock')===clock,'La pelea sigue durante pausa');await command(2);await until(()=>val('BossHP')===4)});
 await test('Zona de impacto resta una vida y da invulnerabilidad temporal',async()=>{const p=type('Player').instances[0],w=type('Warning').instances[0];w.x=p.x;w.y=p.y+20;w.set_bbox_changed();set('BossClock',1.4);set('Invuln',0);set('Lives',3);await sleep(100);assert(val('Lives')===2&&val('Invuln')>0,'No recibió daño de la zona');await sleep(100);assert(val('Lives')===2,'Recibió daño repetido sin protección')});
 await test('Contacto con Don Mugrón también causa daño',async()=>{set('BossClock',2);set('Invuln',0);const boss=type('Boss').instances[0];move(boss.x,boss.y);await sleep(100);assert(val('Lives')===1,'El contacto no causó daño');move(640,280);set('Lives',3);set('Invuln',10)});
 await test('El tercer acierto activa una fase de ataques más rápida',async()=>{set('BossClock',2);set('Cooldown',0);await deliver(3);await until(()=>val('BossHP')===3);set('BossClock',4.5);await sleep(100);assert(val('BossClock')<1,'No acortó el ciclo al perder media vida');set('BossClock',0.3);await sleep(50);await evidence('boss')});
 await test('Latas y tierra visibles recorren la pantalla; tres proyectiles en furia',async()=>{move(640,520);set('Invuln',20);set('BossClock',0.15);await sleep(70);const shots=type('EnemyShot').instances;assert(shots.length===3&&shots.every(s=>s.visible&&s.opacity>0.9),'No aparecen los tres residuos');assert(new Set(shots.map(s=>s.cur_frame)).size===2,'Faltan lata o tierra');const x=shots[0].x;await sleep(100);assert(shots[0].x!==x,'La basura no vuela');await evidence('boss')});
 await test('La embestida solo aparece a media vida y mueve al pato por su trayectoria',async()=>{set('BossHP',4);set('BossClock',2.15);await sleep(80);assert(type('ChargeTrail').instances[0].opacity===0,'Embestida antes de media vida');set('BossHP',3);set('BossClock',1.5);await sleep(80);assert(type('ChargeTrail').instances[0].opacity>0.5,'No anuncia trayectoria');set('BossClock',2.2);await sleep(60);const b=type('Boss').instances[0],x=b.x;await sleep(100);assert(Math.abs(b.x-x)>20,'El pato no embiste');await evidence('embestida')});
 await test('La pausa congela también la basura enemiga',async()=>{set('BossClock',0.2);await sleep(50);await command(2);const shot=type('EnemyShot').instances[0],x=shot.x,y=shot.y;await sleep(160);assert(shot.x===x&&shot.y===y,'Basura sigue moviéndose');await evidence('pausa');await command(2)});
 await test('Durante la embestida no se gastan cargas',async()=>{set('BossClock',2.1);set('Cooldown',0);const bin=type('Bin').instances.find(b=>b.instance_vars[0]===val('Shield')),stock=bin.instance_vars[1];await deliver(val('Shield'));assert(bin.instance_vars[1]===stock,'Disparo permitido durante embestida')});
 await test('La barra del jefe refleja visualmente su media vida',async()=>{const b=type('BossBar').instances[0];assert(b.visible&&Math.abs(b.width-187)<1,'Barra de vida incorrecta')});
 await test('Seis impactos de los tres colores derrotan al jefe',async()=>{set('Invuln',20);for(let i=0;i<3;i++){set('BossClock',3.3);set('Cooldown',0);const expected=val('BossHP')-1;await deliver(val('Shield'));await until(()=>val('BossHP')===expected)}assert(val('State')===4&&val('BossHP')===0&&val('Score')>3360,'No concedió victoria completa');assert(type('Bin').instances.every(b=>b.instance_vars[1]===2),'Consumo de cargas incorrecto')});
 await test('Victoria congela el reloj y permite reiniciar las dos fases',async()=>{const t=val('TimeLeft');await sleep(160);assert(val('TimeLeft')===t,'El reloj sigue en victoria');await evidence('victoria');await command(4);assert(val('State')===0&&val('Stage')===0&&val('BossHP')===6&&type('Trash').instances.length===12&&type('Bin').instances.every(b=>b.instance_vars[1]===0),'No reinició tras victoria')});
 await test('El tiempo del combate también puede agotarse',async()=>{await command(4);set('Clean',12);await until(()=>val('State')===6);await command(4);set('TimeLeft',0.01);await sleep(160);assert(val('State')===5&&val('Stage')===1,'No terminó por tiempo en combate');await command(4)});
 await test('Recursos de audio disponibles: dos músicas y ocho efectos',async()=>{for(const name of ['parque','recoger','correcto','error','victoria','fin','aviso','lanzar','golpe','batalla']){const response=await fetch('../export/html5/media/'+name+'.ogg');assert(response.ok,name+' no disponible');assert((await response.arrayBuffer()).byteLength>1000,name+' vacío')}});
 }catch(e){results.push({name:'Infraestructura de prueba',status:'FAIL',error:e.message})}
 const report={game:'EcoGame 4.0 · Pato furioso',engine:'Construct 2 r213',date:new Date().toISOString(),passed:results.filter(r=>r.status==='PASS').length,total:results.length,results};
 document.querySelector('#status').textContent=report.passed+' / '+report.total+' pruebas aprobadas';document.querySelector('#report').textContent=JSON.stringify(report,null,2);document.querySelector('#run').disabled=false;await fetch('/__qa/report.json',{method:'POST',body:JSON.stringify(report,null,2)});
};
</script></html>
